<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Control | Matriz LED</title>
  <!-- Bootstrap 5.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    :root {
      --neon-cyan: #00e5ff;
      --neon-purple: #bd00ff;
      --bg-gradient: radial-gradient(circle at top, #141b2d 0%, #0a0d14 100%);
    }
    body {
      background: var(--bg-gradient);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, sans-serif;
      padding: 1.5rem;
    }
    .matrix-card {
      background: rgba(18, 24, 38, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 1.25rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 20px rgba(0, 229, 255, 0.1);
      max-width: 460px;
      width: 100%;
    }
    .form-control, .form-select {
      background-color: #0b0f19;
      border: 1px solid #232c42;
      color: #f1f5f9;
      padding: 0.75rem 1rem;
      border-radius: 0.75rem;
    }
    .form-control:focus, .form-select:focus {
      background-color: #0b0f19;
      border-color: var(--neon-cyan);
      box-shadow: 0 0 12px rgba(0, 229, 255, 0.25);
      color: #fff;
    }
    .btn-submit {
      background: linear-gradient(135deg, #00b4d8 0%, #7b2cbf 100%);
      border: none;
      font-weight: 600;
      letter-spacing: 0.5px;
      padding: 0.85rem;
      border-radius: 0.75rem;
      transition: all 0.3s ease;
    }
    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(123, 44, 191, 0.4);
      filter: brightness(1.1);
    }
    .char-badge {
      font-size: 0.75rem;
      color: #64748b;
    }
  </style>
</head>
<body>

<div class="matrix-card p-4 p-md-5">
  <div class="text-center mb-4">
    <div class="d-inline-flex align-items-center justify-content-center bg-dark p-3 rounded-circle border border-info border-opacity-25 mb-3">
      <i class="bi bi-grid-3x3-gap-fill text-info fs-3"></i>
    </div>
    <h3 class="fw-bold text-white mb-1">Matriz LED 32×16</h3>
    <p class="text-secondary small">Envía texto en tiempo real a la pantalla</p>
  </div>

  <form id="matrixForm">
    <div class="mb-3">
      <div class="d-flex justify-content-between align-items-center mb-1">
        <label for="msgInput" class="form-label small fw-semibold text-light mb-0">Mensaje</label>
        <span id="charCount" class="char-badge">0 / 30</span>
      </div>
      <input type="text" class="form-control" id="msgInput" maxlength="30" placeholder="Escribe tu mensaje..." required autocomplete="off">
    </div>

    <div class="mb-4">
      <label for="effectSelect" class="form-label small fw-semibold text-light mb-1">Efecto Visual</label>
      <select class="form-select" id="effectSelect">
        <option value="scroll" selected>Desplazamiento continuo (Scroll)</option>
        <option value="fixed">Fijo centrado</option>
        <option value="blink">Parpadeo suave</option>
        <option value="rainbow">Arcoíris dinámico</option>
      </select>
    </div>

    <button type="submit" class="btn btn-submit text-white w-100 d-flex align-items-center justify-content-center gap-2" id="submitBtn">
      <i class="bi bi-send-fill"></i>
      <span>Transmitir Mensaje</span>
    </button>
  </form>

  <div id="statusAlert" class="alert d-none mt-4 text-center small py-2 border-0" role="alert"></div>
</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzjY-RV8xyq_nFpt3HRUB4HrHyg8w55Ypx1BJtBY09mzx0EWte-kayNNWGLh9j2EQL1OA/exec";
  const form = document.getElementById('matrixForm');
  const input = document.getElementById('msgInput');
  const count = document.getElementById('charCount');
  const btn = document.getElementById('submitBtn');
  const alertBox = document.getElementById('statusAlert');

  // Contador de caracteres
  input.addEventListener('input', () => {
    count.textContent = `${input.value.length} / 30`;
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const textVal = input.value.trim();
    const effectVal = document.getElementById('effectSelect').value;

    if (!textVal) return;

    btn.disabled = true;
    btn.innerHTML = `<span class="spinner-border spinner-border-sm" role="status"></span> Transmitiendo...`;
    alertBox.className = "alert d-none";

    try {
      await fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ text: textVal, effect: effectVal })
      });

      alertBox.className = "alert alert-success mt-4 text-center small py-2 text-white bg-success bg-opacity-25 border border-success border-opacity-50";
      alertBox.innerHTML = `<i class="bi bi-check-circle-fill me-1"></i> ¡Transmitido con éxito!`;
      form.reset();
      count.textContent = "0 / 30";
    } catch (err) {
      alertBox.className = "alert alert-danger mt-4 text-center small py-2 text-white bg-danger bg-opacity-25 border border-danger border-opacity-50";
      alertBox.innerHTML = `<i class="bi bi-exclamation-triangle-fill me-1"></i> Error de conexión. Intenta de nuevo.`;
    } finally {
      btn.disabled = false;
      btn.innerHTML = `<i class="bi bi-send-fill"></i> Transmitir Mensaje`;
      setTimeout(() => alertBox.classList.add('d-none'), 5000);
    }
  });
</script>

</body>
</html>
