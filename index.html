<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Control | Matriz LED 32×16</title>
  <!-- Bootstrap 5.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    :root {
      --bg-radial: radial-gradient(circle at top, #141c2e 0%, #070a10 100%);
    }
    body {
      background: var(--bg-radial);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, sans-serif;
      padding: 1.5rem;
    }
    .panel-card {
      background: rgba(16, 23, 38, 0.9);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 1.25rem;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
      max-width: 520px;
      width: 100%;
    }
    .matrix-bezel {
      background-color: #05070a;
      border: 2px solid #1f293d;
      border-radius: 0.75rem;
      padding: 12px;
      box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.8);
    }
    canvas {
      display: block;
      width: 100%;
      height: auto;
      image-rendering: pixelated;
    }
    .form-control, .form-select {
      background-color: #0a0e17;
      border: 1px solid #222d42;
      color: #f8fafc;
    }
    .form-control:focus, .form-select:focus {
      background-color: #0a0e17;
      border-color: #00d2ff;
      box-shadow: 0 0 10px rgba(0, 210, 255, 0.25);
      color: #fff;
    }
    .color-preset {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid #2d3748;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s;
    }
    .color-preset:hover {
      transform: scale(1.15);
      border-color: #fff;
    }
    .btn-transmit {
      background: linear-gradient(135deg, #00c6ff 0%, #7b2cbf 100%);
      border: none;
      font-weight: 600;
      padding: 0.8rem;
      border-radius: 0.75rem;
      transition: opacity 0.2s, transform 0.2s;
    }
    .btn-transmit:hover {
      transform: translateY(-1px);
      filter: brightness(1.1);
    }
  </style>
</head>
<body>

<div class="panel-card p-4">
  <div class="d-flex align-items-center justify-content-between mb-3">
    <h5 class="fw-bold text-white mb-0"><i class="bi bi-cpu text-info me-2"></i>Matriz 32×16</h5>
    <span class="badge text-bg-dark border border-secondary border-opacity-25 font-monospace">PREVIEW EN VIVO</span>
  </div>

  <!-- Rejilla de Visualización LED -->
  <div class="matrix-bezel mb-4">
    <canvas id="matrixCanvas" width="320" height="70"></canvas>
  </div>

  <form id="matrixForm">
    <!-- Entrada de Texto -->
    <div class="mb-3">
      <div class="d-flex justify-content-between small mb-1">
        <label for="msgInput" class="fw-semibold text-light">Mensaje inferior</label>
        <span id="charCount" class="text-secondary">5 / 30</span>
      </div>
      <input type="text" class="form-control" id="msgInput" maxlength="30" value="HOLA!" placeholder="Escribe un mensaje..." required autocomplete="off">
    </div>

    <!-- Selector de Efecto -->
    <div class="mb-3">
      <label for="effectSelect" class="form-label small fw-semibold text-light mb-1">Efecto visual</label>
      <select class="form-select" id="effectSelect">
        <option value="scroll" selected>Desplazamiento (Scroll continuo)</option>
        <option value="fixed">Fijo centrado</option>
        <option value="blink">Parpadeo suave</option>
        <option value="rainbow">Arcoíris dinámico</option>
      </select>
    </div>

    <!-- Selector de Color -->
    <div class="mb-4">
      <label class="form-label small fw-semibold text-light mb-2">Color del Texto</label>
      <div class="d-flex align-items-center gap-2">
        <input type="color" class="form-control form-control-color border-0 p-1" id="colorInput" value="#00ff66" title="Selector de color libre">
        <div class="d-flex gap-2 ms-2">
          <div class="color-preset" style="background:#00ff66;" data-color="#00ff66" title="Verde Esmeralda"></div>
          <div class="color-preset" style="background:#00d9ff;" data-color="#00d9ff" title="Cian Neón"></div>
          <div class="color-preset" style="background:#ff0055;" data-color="#ff0055" title="Rosa Neón"></div>
          <div class="color-preset" style="background:#ffb700;" data-color="#ffb700" title="Ámbar / Amarillo"></div>
          <div class="color-preset" style="background:#bd00ff;" data-color="#bd00ff" title="Morado Neón"></div>
          <div class="color-preset" style="background:#ffffff;" data-color="#ffffff" title="Blanco Frío"></div>
        </div>
      </div>
      <div id="rainbowNotice" class="form-text text-warning small d-none mt-1">
        <i class="bi bi-info-circle"></i> En modo Arcoíris los colores se generan automáticamente.
      </div>
    </div>

    <button type="submit" class="btn btn-transmit text-white w-100 d-flex align-items-center justify-content-center gap-2" id="submitBtn">
      <i class="bi bi-send-fill"></i>
      <span>Transmitir a la Matriz</span>
    </button>
  </form>

  <div id="statusAlert" class="alert d-none mt-3 text-center small py-2 border-0" role="alert"></div>
</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzjY-RV8xyq_nFpt3HRUB4HrHyg8w55Ypx1BJtBY09mzx0EWte-kayNNWGLh9j2EQL1OA/exec";

  // Tipografía 3x5 idéntica a la ESP32 (números, letras y signos especiales)
  const GLYPHS = {
    '0':[7,5,5,5,7],'1':[2,6,2,2,7],'2':[7,1,7,4,7],'3':[7,1,7,1,7],'4':[5,5,7,1,1],
    '5':[7,4,7,1,7],'6':[7,4,7,5,7],'7':[7,1,2,2,2],'8':[7,5,7,5,7],'9':[7,5,7,1,7],
    'A':[7,5,7,5,5],'B':[6,5,6,5,6],'C':[7,4,4,4,7],'D':[6,5,5,5,6],'E':[7,4,6,4,7],
    'F':[7,4,6,4,4],'G':[7,4,5,5,7],'H':[5,5,7,5,5],'I':[7,2,2,2,7],'J':[1,1,1,5,7],
    'K':[5,6,4,6,5],'L':[4,4,4,4,7],'M':[5,7,5,5,5],'N':[7,5,5,5,5],'O':[7,5,5,5,7],
    'P':[7,5,7,4,4],'Q':[7,5,5,7,1],'R':[6,5,6,5,5],'S':[7,4,7,1,7],'T':[7,2,2,2,2],
    'U':[5,5,5,5,7],'V':[5,5,5,5,2],'W':[5,5,5,7,5],'X':[5,5,2,5,5],'Y':[5,5,2,2,2],
    'Z':[7,1,2,4,7],
    '!':[4,4,4,0,4],'.':[0,0,0,0,4],':':[0,4,0,4,0],'\'':[4,4,0,0,0],'|':[4,4,4,4,4],
    ',':[0,0,0,2,4],';':[0,2,0,2,4],'(':[2,4,4,4,2],')':[4,2,2,2,4],'[':[6,4,4,4,6],
    ']':[6,2,2,2,6],'{':[2,4,6,4,2],'}':[4,2,6,2,4],'@':[7,5,7,4,3],'#':[2,7,2,7,2],
    '$':[2,6,2,3,2],'%':[5,1,2,4,5],'^':[2,5,0,0,0],'&':[2,5,2,5,7],'*':[0,5,2,5,0],
    '?':[6,1,2,0,2],'-':[0,0,7,0,0],'/':[1,1,2,4,4],'\\':[4,4,2,1,1],'"':[5,5,0,0,0],
    ' ':[0,0,0,0,0]
  };

  function getCharWidth(c) {
    if (c === ' ') return 2;
    if (c === '!' || c === '.' || c === ':' || c === '\'' || c === '|') return 1;
    if (c === ',' || c === ';' || c === '(' || c === ')' || c === '[' || c === ']' || c === '{' || c === '}') return 2;
    return 3;
  }

  function getStringWidth(str) {
    let w = 0;
    for (let c of str) w += getCharWidth(c) + 1;
    return w > 0 ? w - 1 : 0;
  }

  const canvas = document.getElementById('matrixCanvas');
  const ctx = canvas.getContext('2d');
  const msgInput = document.getElementById('msgInput');
  const effectSelect = document.getElementById('effectSelect');
  const colorInput = document.getElementById('colorInput');
  const charCount = document.getElementById('charCount');
  const rainbowNotice = document.getElementById('rainbowNotice');

  const COLS = 32;
  const ROWS = 7;
  const LED_SIZE = 8;
  const GAP = 2;

  let previewScrollX = COLS;
  let lastScrollUpdate = 0;

  function renderPreview(timestamp) {
    ctx.fillStyle = '#05070a';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Fondo: Matriz de LEDs apagados
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        let x = c * (LED_SIZE + GAP) + 2;
        let y = r * (LED_SIZE + GAP) + 2;
        ctx.fillStyle = '#0d131f';
        ctx.beginPath();
        ctx.arc(x + LED_SIZE/2, y + LED_SIZE/2, LED_SIZE/2 - 1, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    const text = msgInput.value.toUpperCase();
    const effect = effectSelect.value;
    const baseColor = colorInput.value;
    const strW = getStringWidth(text);

    let startX = 0;
    let visible = true;

    if (effect === 'fixed') {
      startX = Math.floor((COLS - strW) / 2);
    } else if (effect === 'blink') {
      startX = Math.floor((COLS - strW) / 2);
      visible = Math.floor(timestamp / 450) % 2 === 0;
    } else if (effect === 'rainbow') {
      if (strW <= COLS) {
        startX = Math.floor((COLS - strW) / 2);
      } else {
        if (timestamp - lastScrollUpdate > 65) {
          previewScrollX--;
          if (previewScrollX < -strW) previewScrollX = COLS;
          lastScrollUpdate = timestamp;
        }
        startX = previewScrollX;
      }
    } else { // scroll
      if (timestamp - lastScrollUpdate > 65) {
        previewScrollX--;
        if (previewScrollX < -strW) previewScrollX = COLS;
        lastScrollUpdate = timestamp;
      }
      startX = previewScrollX;
    }

    if (visible && text.length > 0) {
      let curX = startX;
      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const glyph = GLYPHS[char] || GLYPHS[' '];
        const w = getCharWidth(char);

        let charColor = baseColor;
        if (effect === 'rainbow') {
          const hue = ((timestamp / 25) + (i * 24)) % 360;
          charColor = `hsl(${hue}, 100%, 55%)`;
        }

        for (let r = 0; r < 5; r++) {
          const rowBits = glyph[r];
          for (let col = 0; col < w; col++) {
            const bit = (rowBits & (0b100 >> col));
            if (bit) {
              const gridX = curX + col;
              const gridY = 1 + r;

              if (gridX >= 0 && gridX < COLS && gridY >= 0 && gridY < ROWS) {
                const px = gridX * (LED_SIZE + GAP) + 2;
                const py = gridY * (LED_SIZE + GAP) + 2;

                ctx.shadowColor = charColor;
                ctx.shadowBlur = 6;
                ctx.fillStyle = charColor;
                ctx.beginPath();
                ctx.arc(px + LED_SIZE/2, py + LED_SIZE/2, LED_SIZE/2 - 1, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
              }
            }
          }
        }
        curX += w + 1;
      }
    }

    requestAnimationFrame(renderPreview);
  }
  requestAnimationFrame(renderPreview);

  msgInput.addEventListener('input', () => {
    charCount.textContent = `${msgInput.value.length} / 30`;
    previewScrollX = COLS;
  });

  effectSelect.addEventListener('change', () => {
    previewScrollX = COLS;
    rainbowNotice.classList.toggle('d-none', effectSelect.value !== 'rainbow');
  });

  document.querySelectorAll('.color-preset').forEach(preset => {
    preset.addEventListener('click', () => {
      colorInput.value = preset.getAttribute('data-color');
    });
  });

  const form = document.getElementById('matrixForm');
  const btn = document.getElementById('submitBtn');
  const alertBox = document.getElementById('statusAlert');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const textVal = msgInput.value.trim();
    if (!textVal) return;

    btn.disabled = true;
    btn.innerHTML = `<span class="spinner-border spinner-border-sm" role="status"></span> Transmitiendo...`;
    alertBox.className = "alert d-none";

    try {
      await fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({
          text: textVal,
          effect: effectSelect.value,
          color: colorInput.value
        })
      });

      alertBox.className = "alert alert-success mt-3 text-center small py-2 bg-success bg-opacity-25 border border-success border-opacity-50 text-white";
      alertBox.innerHTML = `<i class="bi bi-check2-circle me-1"></i> ¡Transmitido con éxito!`;
    } catch (err) {
      alertBox.className = "alert alert-danger mt-3 text-center small py-2 bg-danger bg-opacity-25 border border-danger border-opacity-50 text-white";
      alertBox.innerText = "Error al intentar transmitir a la hoja.";
    } finally {
      btn.disabled = false;
      btn.innerHTML = `<i class="bi bi-send-fill"></i> Transmitir a la Matriz`;
      setTimeout(() => alertBox.classList.add('d-none'), 5000);
    }
  });
</script>

</body>
</html>
